<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 94" width="196" height="94" role="img" aria-label="Brasil">
  <defs>
    <!-- textura de papelão sutil -->
    <pattern id="cardboard" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#d4b896"/>
      <path d="M0,2 L4,2 M2,0 L2,4" stroke="#c4a886" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a888"/>
      <stop offset="100%" stop-color="#a88868"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a8"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e8dcc8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0d4c0" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- sombra da caixa toda -->
  <g filter="url(#shadow)">
    <!-- caixa: face frontal -->
    <rect x="14" y="16" width="78" height="62" fill="url(#boxFront)" stroke="#987858" stroke-width="1.5"/>
    <!-- face superior -->
    <path d="M14,16 L28,4 L104,4 L90,16 Z" fill="url(#boxTop)" stroke="#987858" stroke-width="1.5"/>
    <!-- face lateral -->
    <path d="M90,16 L104,4 L104,66 L90,78 Z" fill="url(#boxSide)" stroke="#987858" stroke-width="1.5"/>

    <!-- fita adesiva horizontal na frente -->
    <rect x="14" y="38" width="78" height="10" fill="url(#tapeGrad)"/>
    <path d="M14,38 L92,38 M14,48 L92,48" stroke="#d8c8b0" stroke-width="0.5" opacity="0.6"/>

    <!-- fita adesiva no topo -->
    <path d="M40,16 L54,16 L58,4 L44,4 Z" fill="url(#tapeGrad)"/>

    <!-- ABAIXO DO ADESIVO: cordas da caixa -->
    <path d="M67,48 L67,78" stroke="#6d5d45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M68,48 L68,78" stroke="#8d7d5d" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ADESIVO COM BANDEIRA DO BRASIL (colado na caixa) -->
  <g transform="translate(24, 26)">
    <!-- base do adesivo (papel branco levemente amarelado) -->
    <rect x="0" y="0" width="56" height="38" rx="2" fill="#fefdf8" stroke="#c8b898" stroke-width="1.2"/>

    <!-- BANDEIRA DO BRASIL - geometria oficial simplificada -->
    <!-- retângulo verde -->
    <rect x="3" y="3" width="50" height="32" fill="#009739"/>

    <!-- losango amarelo -->
    <polygon points="28,5 51,19 28,33 5,19" fill="#FFDF00"/>

    <!-- círculo azul -->
    <circle cx="28" cy="19" r="10.5" fill="#002776"/>

    <!-- faixa branca curva (simplificada como retângulo rotacionado) -->
    <g transform="rotate(-11.5 28 19)">
      <rect x="12" y="17.5" width="32" height="4.5" rx="1" fill="#FFFFFF"/>
      <text x="28" y="20.5" font-family="Arial, Helvetica, sans-serif" font-size="3.2" font-weight="bold" fill="#002776" text-anchor="middle">ORDEM E PROGRESSO</text>
    </g>

    <!-- 27 estrelas pequenas (apenas sugestão visual - 3 fileiras) -->
    <g fill="#FFFFFF" font-family="Arial" font-size="2.2" text-anchor="middle">
      <text x="28" y="11.5">★</text>
      <text x="22" y="15">★</text>
      <text x="34" y="15">★</text>
      <text x="18" y="18.5">★</text>
      <text x="28" y="18.5">★</text>
      <text x="38" y="18.5">★</text>
      <text x="22" y="22">★</text>
      <text x="34" y="22">★</text>
      <text x="28" y="25.5">★</text>
    </g>
  </g>

  <!-- TEXTO GRANDE "BRASIL" AO LADO DA CAIXA -->
  <text x="112" y="58" font-family="Impact, 'Arial Black', sans-serif" font-size="34" font-weight="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="1.5">BRASIL</text>
</svg>