<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 94" width="196" height="94" role="img" aria-label="Brasil">
  <defs>
    <!-- gradientes da caixa de papelão -->
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d8c0"/>
      <stop offset="100%" stop-color="#d8b898"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a888"/>
      <stop offset="100%" stop-color="#a08060"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0d4c0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- GRUPO DA CAIXA (lado esquerdo, 0-106) com sombra -->
  <g filter="url(#shadow)">
    <!-- face frontal da caixa -->
    <rect x="8" y="12" width="90" height="70" fill="url(#boxFront)" stroke="#907050" stroke-width="1.5"/>
    <!-- face superior -->
    <path d="M8,12 L22,0 L112,0 L98,12 Z" fill="url(#boxTop)" stroke="#907050" stroke-width="1.5"/>
    <!-- face lateral direita -->
    <path d="M98,12 L112,0 L112,70 L98,82 Z" fill="url(#boxSide)" stroke="#907050" stroke-width="1.5"/>

    <!-- fita adesiva horizontal na face frontal -->
    <rect x="8" y="38" width="90" height="12" fill="url(#tapeGrad)"/>
    <line x1="8" y1="38" x2="98" y2="38" stroke="#d0c0a8" stroke-width="0.5" opacity="0.6"/>
    <line x1="8" y1="50" x2="98" y2="50" stroke="#d0c0a8" stroke-width="0.5" opacity="0.6"/>

    <!-- fita adesiva no topo -->
    <path d="M32,12 L46,12 L50,0 L36,0 Z" fill="url(#tapeGrad)"/>

    <!-- cordas verticais (passam por cima da fita) -->
    <line x1="72" y1="12" x2="72" y2="82" stroke="#605038" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="73" y1="12" x2="73" y2="82" stroke="#807050" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ADESIVO COM BANDEIRA DO BRASIL (colado na face frontal da caixa) -->
  <g transform="translate(20, 22)">
    <!-- papel do adesivo -->
    <rect x="0" y="0" width="52" height="34" rx="1.5" fill="#fefdf8" stroke="#b8a888" stroke-width="1"/>

    <!-- BANDEIRA DO BRASIL - proporções oficiais 7:10 -->
    <!-- retângulo verde (fundo) -->
    <rect x="2" y="2" width="48" height="30" fill="#009739"/>

    <!-- losango amarelo (inscrito no retângulo, vértices no meio dos lados) -->
    <polygon points="26,3.5 49,17 26,30.5 3,17" fill="#FFDF00"/>

    <!-- círculo azul (centro do losango, raio = 1/7 da altura = ~4.3) -->
    <circle cx="26" cy="17" r="9" fill="#002776"/>

    <!-- faixa branca curva (retângulo rotacionado no centro do círculo) -->
    <g transform="rotate(-11.5 26 17)">
      <rect x="10" y="15.2" width="32" height="3.6" rx="0.8" fill="#FFFFFF"/>
      <text x="26" y="17.8" font-family="Arial, Helvetica, sans-serif" font-size="2.8" font-weight="bold" fill="#002776" text-anchor="middle">ORDEM E PROGRESSO</text>
    </g>

    <!-- estrelas do Cruzeiro do Sul (27 estrelas - representação simplificada) -->
    <g fill="#FFFFFF" font-family="Arial" font-size="2" text-anchor="middle">
      <text x="26" y="9.5">★</text>
      <text x="20" y="13">★</text>
      <text x="32" y="13">★</text>
      <text x="16" y="16.5">★</text>
      <text x="26" y="16.5">★</text>
      <text x="36" y="16.5">★</text>
      <text x="20" y="20">★</text>
      <text x="32" y="20">★</text>
      <text x="26" y="23.5">★</text>
    </g>
  </g>

  <!-- TEXTO "BRASIL" (lado direito, 106-196) - GRANDE, CENTRALIZADO -->
  <text x="151" y="55" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="42" font-weight="normal" fill="#111" text-anchor="middle" letter-spacing="2">BRASIL</text>
</svg>